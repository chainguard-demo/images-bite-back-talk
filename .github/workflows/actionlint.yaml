name: Action Lint
on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

  push:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions: {}

jobs:
  action-lint:
    permissions:
      contents: read # Clone the repository
    name: Action lint
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            api.github.com:443
            github.com:443
            go.dev:443
            hooks.slack.com:443
            release-assets.githubusercontent.com:443

      - name: Check out code
        uses: chainguard-actions/checkout@ec419da8013e66e059571719dbfa6d1483438668 # v7.0.1
        with:
          persist-credentials: false

      - name: Find yamls
        id: get_yamls
        run: |
          set -ex
          mapfile -t yamls < <(find .github/workflows -name "*.y*ml" | grep -v dependabot.)
          echo "files=${yamls[*]}" >> "${GITHUB_OUTPUT}"

      - name: Action lint
        uses: chainguard-actions/action-actionlint@45cf84545ca27558cb4faaa15974241493198eb2 # v1.73.3
        env:
          SHELLCHECK_OPTS: "--exclude=SC2129"
        with:
          actionlint_flags: ${{ steps.get_yamls.outputs.files }}
